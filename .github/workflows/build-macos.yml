name: Guitar Studio AI - Mac Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Preparar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: numpy==1.26.4 numba==0.61.2 llvmlite==0.44.0
          printf "numpy==1.26.4\nnumba==0.61.2\nllvmlite==0.44.0\n" > constraints.txt
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Comprobar compatibilidad
        run: |
          python -c "import torch, torchaudio, librosa, streamlit, basic_pitch, demucs, numba, llvmlite"
          python -m py_compile app.py
          uname -m
