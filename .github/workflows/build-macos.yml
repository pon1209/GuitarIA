name: Guitar Studio AI - Mac Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Preparar lanzador
        run: |
          cat > launcher.py <<'PY'
          import os
          import sys
          import runpy
          from pathlib import Path

          if __name__ == "__main__":
              cache = Path.home() / "Library/Caches/GuitarStudioAI"
              cache.mkdir(parents=True, exist_ok=True)
              os.environ["NUMBA_CACHE_DIR"] = str(cache)
              os.environ["OMP_NUM_THREADS"] = "2"
              os.environ["MKL_NUM_THREADS"] = "2"

              import imageio_ffmpeg
              ffmpeg = cache / "ffmpeg"
              if not ffmpeg.exists():
                  ffmpeg.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
              os.environ["PATH"] = str(cache) + os.pathsep + os.environ.get("PATH", "")

              if sys.argv[1:3] == ["-m", "demucs"]:
                  sys.argv = ["demucs"] + sys.argv[3:]
                  runpy.run_module("demucs.separate", run_name="__main__")
              else:
                  from streamlit.web import cli
                  app = Path(sys._MEIPASS) / "app.py"
                  sys.argv = [
                      "streamlit", "run", str(app),
                      "--server.address=127.0.0.1",
                      "--server.headless=false",
                      "--browser.gatherUsageStats=false",
                      "--theme.base=dark",
                      "--theme.primaryColor=#35d9bd"
                  ]
                  sys.exit(cli.main())
          PY

      - name: Crear aplicacion Mac
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "Guitar Studio AI" \
            --target-arch x86_64 \
            --add-data "app.py:." \
            --collect-all streamlit \
            --collect-all librosa \
            --collect-all torch \
            --collect-all torchaudio \
            --collect-all demucs \
            --collect-all basic_pitch \
            --collect-all coremltools \
            --collect-all numba \
            --collect-all llvmlite \
            --collect-all imageio_ffmpeg \
            --collect-all soundfile \
            --recursive-copy-metadata streamlit \
            --hidden-import demucs.separate \
            --hidden-import pretty_midi \
            launcher.py

      - name: Crear instalador DMG
        run: |
          mkdir -p dmg
          ditto "dist/Guitar Studio AI.app" \
            "dmg/Guitar Studio AI.app"
          ln -s /Applications dmg/Applications
          hdiutil create \
            -volname "Guitar Studio AI" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "GuitarStudioAI-Intel.dmg"

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: GuitarStudioAI-Mac-Intel
          path: GuitarStudioAI-Intel.dmg
          retention-days: 7
